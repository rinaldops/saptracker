name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    name: Lint, type-check e testes
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # pytest-qt sem display: backend offscreen do Qt.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Mypy (tipos)
        run: mypy src

      - name: Pytest (com cobertura)
        run: pytest --cov --cov-report=term-missing

  docs:
    name: Build da documentação (Sphinx)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Sphinx build (HTML, warnings como erro)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Publicar artefato da documentação
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
